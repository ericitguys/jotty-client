[package]
name = "jotty-client"
version = "0.15.3"
edition = "2021"

[lib]
name = "jotty_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
log = "0.4"
semver = "1"
base64 = "0.22"
hound = "3.5"
cpal = "0.18"
tauri-plugin-opener = "^2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

# Desktop-Linux only: the branding title mirror reaches tao's Wayland
# GtkHeaderBar through gtk-rs. Android is also target_os=linux, so the gate
# must exclude it — gtk-sys cannot cross-compile for android (pkg-config).
[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
